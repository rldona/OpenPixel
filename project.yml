name: OpenPixel
options:
  bundleIdPrefix: com.rldona
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OpenPixel:
    type: application
    platform: iOS
    sources:
      - OpenPixel
      # Lua 5.4 for Aseprite scripts (Vendor/Lua/README.md).
      - path: Vendor/Lua/src
        group: Vendor/Lua
        compilerFlags: ["-w"]
    # Merged with the generated Info.plist: the files OpenPixel opens from Files, AirDrop or Mail.
    info:
      path: OpenPixel/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The app's folder in Files (On My iPad > OpenPixel).
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Aseprite sprite
            LSItemContentTypes: [org.aseprite.aseprite]
            LSHandlerRank: Default
          - CFBundleTypeName: Image
            LSItemContentTypes: [public.png, com.compuserve.gif]
            LSHandlerRank: Alternate
          - CFBundleTypeName: Aseprite extension
            LSItemContentTypes: [org.aseprite.extension]
            LSHandlerRank: Alternate
          - CFBundleTypeName: Lua script
            LSItemContentTypes: [org.lua.script]
            LSHandlerRank: Alternate
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.aseprite.aseprite
            UTTypeDescription: Aseprite sprite
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [aseprite, ase]
          - UTTypeIdentifier: org.aseprite.extension
            UTTypeDescription: Aseprite extension
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [aseprite-extension]
          - UTTypeIdentifier: org.lua.script
            UTTypeDescription: Lua script
            UTTypeConformsTo: [public.source-code]
            UTTypeTagSpecification:
              public.filename-extension: [lua]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rldona.openpixel
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenPixel
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: OpenPixel/Scripting/Lua-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/Lua/src
        # iOS has no system(); Lua's os library isn't built, but its headers check this.
        GCC_PREPROCESSOR_DEFINITIONS: $(inherited) LUA_USE_IOS=1
  OpenPixelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OpenPixelTests
    dependencies:
      - target: OpenPixel
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
schemes:
  OpenPixel:
    build:
      targets:
        OpenPixel: all
    test:
      targets:
        - OpenPixelTests
